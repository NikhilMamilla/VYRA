# Phase 3B dataset variant: identical to configs/experiment.yaml except that
# light sensor read-noise is added AFTER blur on blur-containing samples, to
# model real image formation (lens blur, then sensor noise that blur cannot
# remove). See docs/real-world-validation.md / phase3b notes.

version: "phase3b-dataset-blurnoise-v1"
seed: 20260828

paths:
  data_root: data
  raw_subdir: raw
  # Separate processed dir so this variant never overwrites phase2-baseline-v1
  # images (sample ids are shared between builds).
  processed_subdir: processed_blurnoise
  manifests_subdir: manifests
  reports_subdir: ../reports
  runs_subdir: ../runs

dataset:
  source: bsds500
  max_originals: 400
  target_long_edge: 384
  splits:
    train: 0.70
    val: 0.15
    test: 0.15

degradation:
  clean_per_original: 1
  single_per_original: 6
  multi_per_original: 2
  multi_min: 2
  multi_max: 3
  severity_levels: [1, 2, 3, 4, 5]
  enabled: [blur, underexposure, overexposure, noise, corruption, defect]
  post_blur_sensor_noise: true

features:
  version: "cvfeat-v2"
  work_long_edge: 384

baseline:
  model: random_forest
  random_forest:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    class_weight: balanced
    n_jobs: -1
  hist_gradient_boosting:
    max_iter: 300
    learning_rate: 0.08
    max_leaf_nodes: 31
  fit_quality_regressor: true
