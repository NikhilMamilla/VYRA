# Serves the built SPA and proxies API traffic to the backend container, so the
# browser only ever talks to one origin (no CORS, no baked-in backend URL).

upstream vyra_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads are images; keep this in step with MAX_UPLOAD_BYTES.
    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://vyra_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://vyra_backend/health;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
