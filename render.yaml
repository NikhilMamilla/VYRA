# Render.com blueprint — deploys VYRA as three managed resources:
#   * vyra-db        free managed PostgreSQL
#   * vyra-backend   FastAPI + inference bundle (Docker, backend/Dockerfile)
#   * vyra-frontend  the built SPA served as a static site
#
# Deploy:  Render dashboard → New → Blueprint → pick this repo.
# See docs/deployment.md for the full walkthrough (including the one manual
# step: pasting each service's real URL into the other's env vars).

databases:
  - name: vyra-db
    plan: free
    databaseName: vyra
    user: vyra
    region: oregon

services:
  - type: web
    name: vyra-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vyra-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON
        value: "true"
      - key: REQUIRE_ANALYZER
        value: "true"
      - key: MODEL_PATH
        value: /app/model
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MAX_BATCH_SIZE
        value: "10"
      # Lower glibc arena fragmentation — keeps RSS under the 512 MB free cap.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Replace with the real vyra-frontend URL after the first deploy.
      - key: CORS_ORIGINS
        value: https://vyra-frontend.onrender.com

  - type: web
    name: vyra-frontend
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    envVars:
      # Replace with the real vyra-backend URL after the first deploy, then
      # trigger a manual redeploy so Vite bakes it into the bundle.
      - key: VITE_API_BASE_URL
        value: https://vyra-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
